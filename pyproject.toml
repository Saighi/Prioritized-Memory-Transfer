[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prioritized-memory-transfer"
version = "0.1.0"
description = "Prioritized Memory Transfer between predictive-coding associative memories"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
    "plotly",
]

[project.optional-dependencies]
progress = ["tqdm"]

[tool.setuptools]
packages = ["prioritized_memory_transfer"]
